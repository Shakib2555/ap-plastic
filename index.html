

<!DOCTYPE html>

<html lang="bn">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Plastic Products Catalog</title>

<style>

*{box-sizing:border-box}

body{

  margin:0;

  font-family:Arial,sans-serif;

  background:#f3f6fa;

  color:#172b3a

}

header{

  background:#12314a;

  color:white;

  text-align:center;

  padding:28px 14px

}

header h1{margin:0 0 10px;font-size:27px}

header p{margin:5px;color:#d6e7f5}

main{max-width:1100px;margin:auto;padding:18px 12px}

.controls{display:grid;gap:10px;margin:15px 0}

input,select{

  width:100%;

  padding:13px;

  border:1px solid #ccd6df;

  border-radius:9px;

  background:white;

  font-size:16px

}

.summary{

  display:flex;

  justify-content:space-between;

  flex-wrap:wrap;

  gap:8px;

  margin:18px 0

}

.grid{

  display:grid;

  grid-template-columns:repeat(2,minmax(0,1fr));

  gap:12px

}

.card{

  background:white;

  border:1px solid #e0e7ee;

  border-radius:12px;

  overflow:hidden

}

.photo{

  height:130px;

  background:#e5eef6;

  display:flex;

  align-items:center;

  justify-content:center;

  font-size:48px

}

.photo img{width:100%;height:100%;object-fit:cover}

.info{padding:12px}

.info h3{font-size:16px;margin:0 0 8px}

.code,.category{font-size:12px;color:#64748b}

.price{font-size:20px;font-weight:bold;color:#08794d;margin:10px 0}

footer{text-align:center;padding:25px;color:#657789}

@media(min-width:650px){

  .controls{grid-template-columns:2fr 1fr 1fr}

  .grid{grid-template-columns:repeat(4,minmax(0,1fr))}

  .photo{height:160px}

}

</style>

</head>

<body>

<header>

  <h1 id="factoryName">AP PLASTIC</h1>

  <p>Plastic Injection Molding Products</p>

  <p>আমাদের সব পণ্য এক জায়গায় দেখুন</p>

  <p>যোগাযোগ: 01909447236</p>

</header>

<main>

  <h2>আমাদের পণ্যসমূহ</h2>

  <div class="controls">

    <input id="search" placeholder="পণ্যের নাম বা কোড লিখুন">

    <select id="category">

      <option value="">সব ক্যাটাগরি</option>

    </select>

    <select id="sort">

      <option value="default">সাধারণ ক্রম</option>

      <option value="low">দাম: কম থেকে বেশি</option>

      <option value="high">দাম: বেশি থেকে কম</option>

    </select>

  </div>

  <div class="summary">

    <strong id="count">পণ্য: ০</strong>

    <span>দাম বাংলাদেশি টাকায় (৳)</span>

  </div>

  <div id="products" class="grid"></div>

</main>

<footer>

  পণ্যের দাম ও বিস্তারিত জানতে ফ্যাক্টরির সঙ্গে যোগাযোগ করুন।

</footer>

<script>

const products = [

  {

    code:"P-001",

    name:"প্লাস্টিক কন্টেইনার",

    category:"কন্টেইনার",

    price:50,

    emoji:"🧺",

    image:""

  },

  {

    code:"P-002",

    name:"প্লাস্টিক ঝুড়ি",

    category:"ঝুড়ি",

    price:120,

    emoji:"🧺",

    image:""

  },

  {

    code:"P-003",

    name:"প্লাস্টিক ঢাকনা",

    category:"ঢাকনা",

    price:15,

    emoji:"🥣",

    image:""

  },

  {

    code:"P-004",

    name:"প্লাস্টিক মগ",

    category:"ঘরোয়া পণ্য",

    price:35,

    emoji:"🥤",

    image:""

  },

  {

    code:"P-005",

    name:"প্লাস্টিক বক্স",

    category:"কন্টেইনার",

    price:80,

    emoji:"📦",

    image:""

  },

  {

    code:"P-006",

    name:"প্লাস্টিক কাপ",

    category:"ঘরোয়া পণ্য",

    price:20,

    emoji:"🥤",

    image:""

  }

];

const search = document.getElementById("search");

const category = document.getElementById("category");

const sort = document.getElementById("sort");

const container = document.getElementById("products");

[...new Set(products.map(p => p.category))].forEach(c => {

  const option = document.createElement("option");

  option.value = c;

  option.textContent = c;

  category.appendChild(option);

});

function showProducts() {

  let list = products.filter(p =>

    (p.name + " " + p.code)

      .toLowerCase()

      .includes(search.value.trim().toLowerCase()) &&

    (!category.value || p.category === category.value)

  );

  if (sort.value === "low") {

    list.sort((a,b) => a.price - b.price);

  }

  if (sort.value === "high") {

    list.sort((a,b) => b.price - a.price);

  }

  document.getElementById("count").textContent =

    "পণ্য: " + list.length;

  container.replaceChildren();

  if (list.length === 0) {

    container.textContent = "কোনো পণ্য পাওয়া যায়নি।";

    return;

  }

  list.forEach(p => {

    const card = document.createElement("article");

    card.className = "card";

    const photo = document.createElement("div");

    photo.className = "photo";

    if (p.image) {

      const img = document.createElement("img");

      img.src = p.image;

      img.alt = p.name;

      img.loading = "lazy";

      img.onerror = () => {

        photo.textContent = p.emoji || "📦";

      };

      photo.appendChild(img);

    } else {

      photo.textContent = p.emoji || "📦";

    }

    const info = document.createElement("div");

    info.className = "info";

    const name = document.createElement("h3");

    name.textContent = p.name;

    const code = document.createElement("div");

    code.className = "code";

    code.textContent = "কোড: " + p.code;

    const price = document.createElement("div");

    price.className = "price";

    price.textContent =

      "৳ " + Number(p.price).toLocaleString("en-BD");

    const cat = document.createElement("div");

    cat.className = "category";

    cat.textContent = p.category;

    info.append(name, code, price, cat);

    card.append(photo, info);

    container.appendChild(card);

  });

}

search.addEventListener("input", showProducts);

category.addEventListener("change", showProducts);

sort.addEventListener("change", showProducts);

showProducts();

</script>

</body>

</html>
